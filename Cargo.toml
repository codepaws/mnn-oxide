[workspace]
resolver = "2"
members = ["mnn-oxide-sys"]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/codepaws/mnn-oxide"
homepage = "https://github.com/codepaws/mnn-oxide"
description = "Rust bindings for Alibaba MNN (Mobile Neural Network) inference engine"
keywords = ["mnn", "neural-network", "inference", "deep-learning", "machine-learning"]
categories = ["api-bindings", "algorithms", "science"]
rust-version = "1.88"
authors = ["DJ.W <wapznw@gmail.com>"]

[workspace.dependencies]
thiserror = "1.0"
tokio = { version = "1.0", default-features = false }
bindgen = "0.69"
cmake = "0.1"
pkg-config = "0.3"

[package]
name = "mnn-oxide"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Safe Rust bindings for Alibaba MNN (Mobile Neural Network) inference engine"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
authors.workspace = true
documentation = "https://docs.rs/mnn-oxide"

[features]
default = ["cpu", "dynamic"]

# Linking method
static = ["mnn-oxide-sys/static"]
dynamic = ["mnn-oxide-sys/dynamic"]

# Backend support
cpu = ["mnn-oxide-sys/cpu"]
cuda = ["mnn-oxide-sys/cuda"]
opencl = ["mnn-oxide-sys/opencl"]
vulkan = ["mnn-oxide-sys/vulkan"]
metal = ["mnn-oxide-sys/metal"]

# Precision support
fp16 = ["mnn-oxide-sys/fp16", "dep:half"]
bf16 = []
int8 = ["mnn-oxide-sys/int8"]

# Quantization
quantization = ["mnn-oxide-sys/quantization"]

# x86 SIMD optimizations
sse = ["mnn-oxide-sys/sse"]
avx2 = ["mnn-oxide-sys/avx2"]
avx512 = ["mnn-oxide-sys/avx512"]

# Async support
async = []

# Build options
# Opt-in user-supplied artifact; requires explicit URL, digest, target, version, and cache.
use-prebuilt = ["mnn-oxide-sys/use-prebuilt"]
# Explicit source build from an existing checkout at a full commit SHA.
build-from-source = ["mnn-oxide-sys/build-from-source"]
# Use system-installed MNN
system-mnn = ["mnn-oxide-sys/system-mnn"]

# Extended API features
# Image processing support (requires MNN with CV module)
image-process = ["mnn-oxide-sys/image-process"]
# Dynamic computation graph support (requires MNN with Expr/Module)
module = ["mnn-oxide-sys/module"]
# Multi-session runtime sharing (requires MNN with RuntimeManager)
runtime = ["mnn-oxide-sys/runtime"]
# LLM large language model inference (requires a compatible explicit MNN build)
llm = ["mnn-oxide-sys/llm"]

# Platform specific (usually auto-detected)
android = ["mnn-oxide-sys/android"]
ios = ["mnn-oxide-sys/ios"]
embedded = []

[dependencies]
# default-features = false prevents implicit sys-crate features; this crate
# forwards the requested link mode and never acquires MNN by default.
mnn-oxide-sys = { path = "mnn-oxide-sys", version = "0.1", package = "mnn-oxide-sys", default-features = false }
thiserror = { workspace = true }
half = { version = "2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3.0"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[package.metadata.docs.rs]
# docs.rs doesn't have network access or cmake, so native library linking is skipped
# in build.rs when DOCS_RS is set. Use minimal features for documentation.
features = ["cpu"]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "basic_inference"
required-features = ["cpu"]

[[example]]
name = "model_smoke"
required-features = ["cpu"]

[[example]]
name = "async_inference"
required-features = ["async"]

[[example]]
name = "gpu_backend"
required-features = ["cuda"]

[[example]]
name = "image_process"
required-features = ["image-process"]

[[example]]
name = "mnn_cv"
required-features = ["image-process"]

[[example]]
name = "llm_chat"
required-features = ["llm"]

[[example]]
name = "llm_stream"
required-features = ["llm"]

[[example]]
name = "llm_embedding"
required-features = ["llm"]
