          path: artifact/
          retention-days: 7

  release:
    needs:
      - resolve-mnn
      - build-windows
      - build-linux
      - build-macos
      - build-android
      - build-ios
      - build-windows-cuda
      - build-linux-cuda
      - build-windows-opencl
      - build-linux-opencl
      - build-linux-vulkan
      - build-android-opencl
      - build-android-vulkan
      - test-native
      - test-android
      - test-ios
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check out the exact MNN source used by build jobs
        env:
          MNN_SOURCE_REF: ${{ needs.resolve-mnn.outputs.source_ref }}
          MNN_SOURCE_COMMIT: ${{ needs.resolve-mnn.outputs.source_commit }}
        run: |
          git clone --depth 1 --branch "$MNN_SOURCE_REF" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "$MNN_SOURCE_COMMIT"

      - name: Add source metadata, notices, and checksums to each artifact
        run: |
          set -euo pipefail
          for dir in artifacts/mnn-*/; do
            name=${dir%/}
            name=${name##*/}
            target=${name#mnn-}
            backends=(--backend cpu)
            runner=ubuntu-latest
            opencl=false
            vulkan=false
            cuda=false
            case "$target" in
              *-cuda) target=${target%-cuda}; cuda=true; backends+=(--backend cuda) ;;
              *-opencl) target=${target%-opencl}; opencl=true; backends+=(--backend opencl) ;;
              *-vulkan) target=${target%-vulkan}; vulkan=true; backends+=(--backend vulkan) ;;
            esac
            case "$target" in
              *windows*) runner=windows-2022 ;;
              *apple*) runner=macos-latest ;;
            esac
            source_patch=''
            if [[ "$target" == *android* ]]; then
              patch_sha=$(sha256sum scripts/patch_mnn_llm_cmake.py | awk '{print $1}')
              source_patch=",\"source_patch_sha256\":\"$patch_sha\""
            fi
            options="{\"MNN_BUILD_SHARED_LIBS\":false,\"MNN_BUILD_LLM\":true,\"LLM_SUPPORT_HTTP_RESOURCE\":false,\"MNN_BUILD_TOOLS\":false,\"MNN_BUILD_TEST\":false,\"MNN_BUILD_BENCHMARK\":false,\"MNN_BUILD_QUANT\":false,\"MNN_BUILD_TRAIN\":false,\"MNN_CUDA\":$cuda,\"MNN_OPENCL\":$opencl,\"MNN_VULKAN\":$vulkan$source_patch}"
            toolchain="{\"build_runner\":\"$runner\"}"
            python scripts/package_mnn_artifact.py "$dir" mnn-source \
              --target "$target" --link-mode static "${backends[@]}" \
              --optional-module llm --build-options "$options" --toolchain "$toolchain"
          done

      - name: Create release archives
        run: |
          set -euo pipefail
          cd artifacts
          for dir in mnn-*/; do
            name="${dir%/}"
            tar -czvf "${name}.tar.gz" -C "$dir" .
            echo "Created ${name}.tar.gz"
          done
          sha256sum *.tar.gz > SHA256SUMS
          ls -la *.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Test native targets (Windows, Linux, macOS)
  test-native:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: i686-pc-windows-msvc
            os: windows-2022
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest  # Cross-compile for x86_64 on Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest  # Apple Silicon native
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select MSVC linker for Rust
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}".ToUpperInvariant().Replace('-', '_')
          $targetArch = if ($target.StartsWith('I686_')) { 'x86' } else { 'x64' }
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\$targetArch\link.exe"
          if (-not (Test-Path -LiteralPath $linker)) { throw "MSVC linker not found: $linker" }
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_${target}_LINKER=$linker"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mnn-${{ matrix.target }}
          path: mnn-prebuilt

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu
        continue-on-error: true

      - name: Test linking
        shell: bash
        run: |
          export MNN_LIB_DIR="$(pwd)/mnn-prebuilt/lib"
          export MNN_INCLUDE_DIR="$(pwd)/mnn-prebuilt/include"
          cargo check --target ${{ matrix.target }}

  # Test Android cross-compilation
  test-android:
    needs: [build-android]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mnn-${{ matrix.target }}
          path: mnn-prebuilt

      - name: Test linking
        run: |
          export MNN_LIB_DIR="$(pwd)/mnn-prebuilt/lib"
          export MNN_INCLUDE_DIR="$(pwd)/mnn-prebuilt/include"
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cargo check --target ${{ matrix.target }}

  # Test iOS cross-compilation
  test-ios:
    needs: [build-ios]
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-ios
          - target: aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mnn-${{ matrix.target }}
          path: mnn-prebuilt

      - name: Test linking
        run: |
          export MNN_LIB_DIR="$(pwd)/mnn-prebuilt/lib"
          export MNN_INCLUDE_DIR="$(pwd)/mnn-prebuilt/include"
          cargo check --target ${{ matrix.target }}
