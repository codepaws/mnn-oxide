name: Build Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mnn_version:
        description: 'MNN source tag to build (currently pinned by default to 3.6.1)'
        required: false
        default: '3.6.1'

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  resolve-mnn:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
    steps:
      - name: Resolve immutable MNN source revision
        id: resolve
        env:
          MNN_SOURCE_REF: ${{ inputs.mnn_version || '3.6.1' }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$MNN_SOURCE_REF"
          git ls-remote https://github.com/alibaba/MNN.git \
            "refs/tags/$MNN_SOURCE_REF" "refs/tags/$MNN_SOURCE_REF^{}" > refs.txt
          source_commit=$(awk '$2 ~ /\^\{\}$/ { peeled=$1 } END { if (peeled != "") print peeled }' refs.txt)
          if [ -z "$source_commit" ]; then
            source_commit=$(awk -v ref="refs/tags/$MNN_SOURCE_REF" '$2 == ref { print $1 }' refs.txt)
          fi
          if [[ ! "$source_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Could not resolve MNN tag $MNN_SOURCE_REF to a commit" >&2
            exit 1
          fi
          echo "source_ref=$MNN_SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "Resolved MNN $MNN_SOURCE_REF to $source_commit"

  build-windows:
    needs: resolve-mnn
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: Win32
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Get MNN Source
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Build MNN
        shell: bash
        run: |
          cmake -B build -S mnn-source \
            -G "Visual Studio 17 2022" -A ${{ matrix.arch }} \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_WIN_RUNTIME_MT=ON \
            -DMNN_BUILD_LLM=ON \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_QUANT=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --config Release --parallel --target MNN
          cmake --build build --config Release --target INSTALL

      - name: Package
        shell: bash
        run: |
          mkdir -p artifact/include artifact/lib
          cp -r install/include/* artifact/include/ || true
          # Find the library file
          if [ -f "install/lib/mnn.lib" ]; then
            cp install/lib/mnn.lib artifact/lib/
          elif [ -f "build/Release/mnn.lib" ]; then
            cp build/Release/mnn.lib artifact/lib/
          elif [ -f "build/mnn.lib" ]; then
            cp build/mnn.lib artifact/lib/
          fi
          # Also copy MNN headers from source if not in install
          if [ ! -d "artifact/include/MNN" ]; then
            cp -r mnn-source/include/* artifact/include/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-${{ matrix.target }}
          path: artifact/
          retention-days: 7

  build-linux:
    needs: resolve-mnn
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: native
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Get MNN Source
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Build MNN
        run: |
          CMAKE_ARGS=""
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            CMAKE_ARGS="-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DMNN_USE_SSE=OFF -DMNN_ARM82=ON"
          fi
          cmake -B build -S mnn-source -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_BUILD_LLM=ON \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_QUANT=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DCMAKE_INSTALL_PREFIX=install \
            $CMAKE_ARGS
          cmake --build build --parallel --target MNN
          cmake --install build

      - name: Package
        run: |
          mkdir -p artifact/include artifact/lib
          cp -r install/include/* artifact/include/ || true
          if [ -f "install/lib/libMNN.a" ]; then
            cp install/lib/libMNN.a artifact/lib/
          elif [ -f "build/libMNN.a" ]; then
            cp build/libMNN.a artifact/lib/
          fi
          # Copy headers from source if needed
          if [ ! -d "artifact/include/MNN" ]; then
            cp -r mnn-source/include/* artifact/include/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-${{ matrix.target }}
          path: artifact/
          retention-days: 7

  # CUDA builds for Windows and Linux x86_64
  build-windows-cuda:
    needs: resolve-mnn
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'

      - name: Get MNN Source
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Build MNN with CUDA
        shell: bash
        run: |
          cmake -B build -S mnn-source \
            -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CUDA_STANDARD=17 \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_WIN_RUNTIME_MT=ON \
            -DMNN_CUDA=ON \
            -DMNN_BUILD_LLM=ON \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_QUANT=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --config Release --parallel --target MNN
          cmake --build build --config Release --target INSTALL

      - name: Package
        shell: bash
        run: |
          mkdir -p artifact/include artifact/lib
          cp -r install/include/* artifact/include/ || true
          if [ -f "install/lib/mnn.lib" ]; then
            cp install/lib/mnn.lib artifact/lib/
          elif [ -f "build/Release/mnn.lib" ]; then
            cp build/Release/mnn.lib artifact/lib/
          fi
          if [ ! -d "artifact/include/MNN" ]; then
            cp -r mnn-source/include/* artifact/include/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-x86_64-pc-windows-msvc-cuda
          path: artifact/
          retention-days: 7

  build-linux-cuda:
    needs: resolve-mnn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'

      - name: Get MNN Source
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Build MNN with CUDA
        run: |
          cmake -B build -S mnn-source -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CUDA_STANDARD=17 \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_CUDA=ON \
            -DMNN_BUILD_LLM=ON \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_QUANT=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --parallel --target MNN
          cmake --install build

      - name: Package
        run: |
          mkdir -p artifact/include artifact/lib
          cp -r install/include/* artifact/include/ || true
          if [ -f "install/lib/libMNN.a" ]; then
            cp install/lib/libMNN.a artifact/lib/
          elif [ -f "build/libMNN.a" ]; then
            cp build/libMNN.a artifact/lib/
          fi
          if [ ! -d "artifact/include/MNN" ]; then
            cp -r mnn-source/include/* artifact/include/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-x86_64-unknown-linux-gnu-cuda
          path: artifact/
          retention-days: 7

  build-macos:
    needs: resolve-mnn
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Get MNN Source
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Build MNN
        run: |
          # Set architecture-specific options
          ARCH_OPTIONS=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ARCH_OPTIONS="-DMNN_ARM82=ON -DMNN_USE_SSE=OFF"
          fi

          cmake -B build -S mnn-source -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_METAL=ON \
            -DMNN_BUILD_LLM=ON \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_QUANT=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_INSTALL_PREFIX=install \
            $ARCH_OPTIONS
          cmake --build build --parallel --target MNN
          cmake --install build

      - name: Package
        run: |
          mkdir -p artifact/include artifact/lib
          cp -r install/include/* artifact/include/ || true
          if [ -f "install/lib/libMNN.a" ]; then
            cp install/lib/libMNN.a artifact/lib/
          elif [ -f "build/libMNN.a" ]; then
            cp build/libMNN.a artifact/lib/
          fi
          # Copy headers from source if needed
          if [ ! -d "artifact/include/MNN" ]; then
            cp -r mnn-source/include/* artifact/include/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-${{ matrix.target }}
          path: artifact/
          retention-days: 7

  build-android:
    needs: resolve-mnn
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Get MNN Source
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Patch MNN LLM CMake (OBJECT library POST_BUILD workaround)
        run: |
          # Upstream MNN bug: with MNN_SEP_BUILD=OFF the `llm` target is an
          # OBJECT library, but transformers/llm/engine/CMakeLists.txt attaches
          # a POST_BUILD command to it, which modern CMake rejects.
          python3 scripts/patch_mnn_llm_cmake.py mnn-source

      - name: Build MNN
        run: |
          # Set ARM-specific options
          ARM_OPTIONS=""
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            ARM_OPTIONS="-DMNN_ARM82=ON"
          elif [ "${{ matrix.abi }}" = "armeabi-v7a" ]; then
            ARM_OPTIONS="-DMNN_USE_SSE=OFF"
          fi

          cmake -B build -S mnn-source -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_KLEIDIAI=OFF \
            -DMNN_BUILD_LLM=ON \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_QUANT=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DCMAKE_INSTALL_PREFIX=install \
            $ARM_OPTIONS
          cmake --build build --parallel --target MNN
          cmake --install build

      - name: Package
        run: |
          mkdir -p artifact/include artifact/lib
          cp -r install/include/* artifact/include/ || true
          if [ -f "install/lib/libMNN.a" ]; then
            cp install/lib/libMNN.a artifact/lib/
          elif [ -f "build/libMNN.a" ]; then
            cp build/libMNN.a artifact/lib/
          fi
          # Copy headers from source if needed
          if [ ! -d "artifact/include/MNN" ]; then
            cp -r mnn-source/include/* artifact/include/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-${{ matrix.target }}
          path: artifact/
          retention-days: 7

  build-ios:
    needs: resolve-mnn
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-ios
            platform: OS64
          - target: aarch64-apple-ios-sim
            platform: SIMULATORARM64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Get MNN Source
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Build MNN
        run: |
          # Set SDK and architecture based on target
          if [ "${{ matrix.target }}" = "aarch64-apple-ios" ]; then
            SDK="iphoneos"
            ARCH="arm64"
            ENABLE_METAL=ON
          else
            # Simulator - Metal works on M1+ Macs but requires different handling
            SDK="iphonesimulator"
            ARCH="arm64"
            ENABLE_METAL=OFF
          fi

          cmake -B build -S mnn-source -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=$ARCH \
            -DCMAKE_OSX_SYSROOT=$SDK \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_METAL=$ENABLE_METAL \
            -DMNN_ARM82=ON \
            -DMNN_BUILD_LLM=ON \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_OPENCL=OFF \
            -DMNN_OPENGL=OFF \
            -DMNN_VULKAN=OFF \
            -DMNN_CUDA=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_QUANT=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DMNN_BUILD_CONVERTER=OFF \
            -DMNN_BUILD_DEMO=OFF \
            -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --parallel --target MNN
          cmake --install build

      - name: Package
        run: |
          mkdir -p artifact/include artifact/lib
          cp -r install/include/* artifact/include/ || true
          if [ -f "install/lib/libMNN.a" ]; then
            cp install/lib/libMNN.a artifact/lib/
          elif [ -f "build/libMNN.a" ]; then
            cp build/libMNN.a artifact/lib/
          fi
          # Copy headers from source if needed
          if [ ! -d "artifact/include/MNN" ]; then
            cp -r mnn-source/include/* artifact/include/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-${{ matrix.target }}
          path: artifact/
          retention-days: 7

  # GPU Backend builds
  build-windows-opencl:
    needs: resolve-mnn
    runs-on: windows-2022
