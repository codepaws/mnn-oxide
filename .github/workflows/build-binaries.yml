            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_VULKAN=ON \
            -DMNN_ARM82=ON \
            -DMNN_KLEIDIAI=OFF \
            -DMNN_BUILD_LLM=ON \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
