  build-linux-vulkan:
    needs: resolve-mnn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build vulkan-tools libvulkan-dev

      - name: Get MNN Source
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Build MNN with Vulkan
        run: |
          cmake -B build -S mnn-source -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_VULKAN=ON \
