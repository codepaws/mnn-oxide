        with:
          arch: x64

      - name: Install OpenCL SDK
        shell: bash
        run: |
          # Use NuGet to install OpenCL headers and loader
          nuget install opencl-nug -Version 0.777.77 -OutputDirectory C:\opencl-nug

      - name: Get MNN Source
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Build MNN with OpenCL
