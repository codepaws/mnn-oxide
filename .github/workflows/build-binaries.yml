            -DMNN_BUILD_QUANT=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --parallel --target MNN
          cmake --install build

      - name: Package
        run: |
          mkdir -p artifact/include artifact/lib
          cp -r install/include/* artifact/include/ || true
          if [ -f "install/lib/libMNN.a" ]; then
            cp install/lib/libMNN.a artifact/lib/
          elif [ -f "build/libMNN.a" ]; then
            cp build/libMNN.a artifact/lib/
          fi
          if [ ! -d "artifact/include/MNN" ]; then
            cp -r mnn-source/include/* artifact/include/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-x86_64-unknown-linux-gnu-vulkan
          path: artifact/
          retention-days: 7

  build-android-opencl:
    needs: resolve-mnn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Get MNN Source
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-mnn.outputs.source_ref }}" https://github.com/alibaba/MNN.git mnn-source
          test "$(git -C mnn-source rev-parse HEAD)" = "${{ needs.resolve-mnn.outputs.source_commit }}"

      - name: Patch MNN LLM CMake (OBJECT library POST_BUILD workaround)
        run: |
          # Upstream MNN bug: with MNN_SEP_BUILD=OFF the `llm` target is an
          # OBJECT library, but transformers/llm/engine/CMakeLists.txt attaches
          # a POST_BUILD command to it, which modern CMake rejects.
          python3 scripts/patch_mnn_llm_cmake.py mnn-source

      - name: Build MNN with OpenCL for Android
        run: |
          cmake -B build -S mnn-source -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_OPENCL=ON \
            -DMNN_ARM82=ON \
            -DMNN_KLEIDIAI=OFF \
            -DMNN_BUILD_LLM=ON \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_QUANT=OFF \
            -DMNN_BUILD_TRAIN=OFF \
            -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --parallel --target MNN
          cmake --install build

      - name: Package
        run: |
          mkdir -p artifact/include artifact/lib
          cp -r install/include/* artifact/include/ || true
          if [ -f "install/lib/libMNN.a" ]; then
            cp install/lib/libMNN.a artifact/lib/
          elif [ -f "build/libMNN.a" ]; then
            cp build/libMNN.a artifact/lib/
          fi
          if [ ! -d "artifact/include/MNN" ]; then
            cp -r mnn-source/include/* artifact/include/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-aarch64-linux-android-opencl
          path: artifact/
          retention-days: 7

  build-android-vulkan:
