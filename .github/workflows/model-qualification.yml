name: Model qualification (CPU)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Cargo runs the sys crate's build script from its package directory, so the
  # checked-out source path must be absolute rather than relative to the repo.
  MNN_SOURCE_PATH: ${{ github.workspace }}/target/mnn-source-3.6.1
  MNN_SOURCE_VERSION: d407447ed56c4121a11ccbd266dc184ca1ead0c2
  MNN_MSVC_RUNTIME: MD
  NUM_JOBS: 4

jobs:
  cpu-model-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Windows x86-64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout crate
        uses: actions/checkout@v4

      - name: Checkout pinned MNN source
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          ref: d407447ed56c4121a11ccbd266dc184ca1ead0c2
          path: target/mnn-source-3.6.1
          persist-credentials: false

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select MSVC linker for Rust
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}".ToUpperInvariant().Replace('-', '_')
          $targetArch = if ($target.StartsWith('I686_')) { 'x86' } else { 'x64' }
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\$targetArch\link.exe"
          if (-not (Test-Path -LiteralPath $linker)) { throw "MSVC linker not found: $linker" }
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_${target}_LINKER=$linker"

      - name: Assert macOS runner is ARM64
        if: runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin'
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo and native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-model-qualification-${{ env.MNN_SOURCE_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-model-qualification-${{ env.MNN_SOURCE_VERSION }}-

      - name: Run native crate tests
        # This job explicitly selects static linking, so the separate default-
        # feature assertion for dynamic linking is not applicable here.
        run: >-
          cargo test --target ${{ matrix.target }} --no-default-features
          --features cpu,static,build-from-source --
          --skip cargo_defaults_to_dynamic_mnn_linking

      - name: Run pinned model qualification integration test
        run: >-
          cargo test --target ${{ matrix.target }} --no-default-features
          --features cpu,static,build-from-source --test model_qualification --
          --ignored

      - name: Download pinned model and run inference smoke test
        run: >-
          cargo run --target ${{ matrix.target }} --example model_smoke
          --no-default-features --features cpu,static,build-from-source
